<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06100c" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Fortune Avenue — roll in, buy big, and cause chaos in a colorful 2–6 player board game." />
    <title>Fortune Avenue</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-rounded, "Avenir Next", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020706;
        color: #fff7dc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #020706;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      .opening {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 35%, rgba(42, 133, 80, 0.26), transparent 42%),
          linear-gradient(145deg, #03120c 0%, #020706 56%, #180907 100%);
      }

      .cover,
      .shade,
      .spark-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .cover {
        z-index: -4;
        inset: -4%;
        background-image: url("/cover.webp");
        background-position: center;
        background-size: cover;
        filter: saturate(0.92) contrast(1.08);
        animation: cover-drift 18s ease-in-out infinite alternate;
      }

      .shade {
        z-index: -3;
        background:
          linear-gradient(180deg, rgba(1, 7, 5, 0.22), rgba(1, 7, 5, 0.64)),
          radial-gradient(circle at 50% 46%, rgba(6, 22, 14, 0.12) 0 17%, rgba(2, 7, 5, 0.77) 72%),
          linear-gradient(125deg, rgba(4, 31, 20, 0.6), rgba(72, 15, 9, 0.34));
      }

      .spark-field {
        z-index: -2;
        overflow: hidden;
      }

      .spark {
        --size: 4px;
        --left: 50%;
        --delay: 0s;
        --duration: 8s;
        position: absolute;
        bottom: -8%;
        left: var(--left);
        width: var(--size);
        height: var(--size);
        border-radius: 999px;
        background: #ffe891;
        box-shadow: 0 0 9px 2px rgba(255, 209, 91, 0.7);
        opacity: 0;
        animation: spark-rise var(--duration) linear var(--delay) infinite;
      }

      .frame {
        position: relative;
        z-index: 2147483647;
        width: min(690px, 100%);
        padding: 1px;
        border-radius: 30px;
        background: linear-gradient(135deg, #fff1a8, #a66f16 42%, #f9d96c 70%, #77430d);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.72),
          0 0 52px rgba(217, 176, 70, 0.22);
      }

      .panel {
        position: relative;
        display: grid;
        width: 100%;
        justify-items: center;
        overflow: hidden;
        padding: clamp(25px, 6vw, 48px) clamp(18px, 6vw, 48px) clamp(22px, 5vw, 38px);
        border: 1px solid rgba(255, 240, 172, 0.25);
        border-radius: 29px;
        background:
          radial-gradient(circle at 50% 4%, rgba(31, 105, 64, 0.42), transparent 37%),
          linear-gradient(145deg, rgba(8, 30, 21, 0.98), rgba(4, 14, 11, 0.99) 54%, rgba(30, 10, 8, 0.98));
        color: #fff7dc;
        text-align: center;
        opacity: 1;
        visibility: visible;
      }

      .panel::before {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(112deg, transparent 20%, rgba(255, 232, 145, 0.08) 46%, transparent 68%);
        content: "";
        pointer-events: none;
        transform: translateX(-110%);
        animation: panel-glint 7s ease-in-out 1.4s infinite;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #ffe995;
        font-size: clamp(0.62rem, 2.5vw, 0.76rem);
        font-weight: 900;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        color: #ffe58a;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.55rem, 15vw, 7rem);
        font-weight: 900;
        line-height: 0.72;
        letter-spacing: -0.065em;
        text-transform: uppercase;
        text-shadow:
          0 2px 0 #845413,
          0 8px 28px rgba(244, 198, 70, 0.26);
      }

      h1 span:last-child {
        margin-top: 0.46em;
        font-size: 0.69em;
        letter-spacing: 0.045em;
      }

      .tagline {
        margin: clamp(19px, 5vw, 30px) 0 10px;
        color: #f8e3ad;
        font-size: clamp(0.78rem, 3.2vw, 1rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .features {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 14px;
        margin: 0 0 clamp(20px, 5vw, 28px);
        color: #b9cfbd;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .features span:not(:last-child)::after {
        margin-left: 14px;
        color: #d7a93f;
        content: "◆";
        font-size: 0.48rem;
        vertical-align: 0.12rem;
      }

      .actions {
        display: grid;
        width: min(470px, 100%);
        grid-template-columns: 1.28fr 0.92fr;
        gap: 11px;
      }

      .button {
        position: relative;
        display: inline-flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 14px 20px;
        border: 1px solid #f8df84;
        border-radius: 14px;
        font-size: 0.82rem;
        font-weight: 950;
        letter-spacing: 0.08em;
        line-height: 1.1;
        text-decoration: none;
        text-transform: uppercase;
        transform: translateY(0);
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background-color 160ms ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .button-primary {
        background: linear-gradient(180deg, #ffe99a, #d6a63d);
        box-shadow: 0 8px 22px rgba(215, 169, 58, 0.24), inset 0 1px rgba(255, 255, 255, 0.68);
        color: #171006;
      }

      .button-secondary {
        border-color: #b98b30;
        background: linear-gradient(180deg, #173b2b, #0b2118);
        box-shadow: inset 0 1px rgba(255, 240, 172, 0.12);
        color: #fff2c6;
      }

      .button:hover,
      .button:focus-visible {
        outline: none;
        transform: translateY(-2px);
      }

      .button-primary:hover,
      .button-primary:focus-visible {
        box-shadow: 0 12px 30px rgba(215, 169, 58, 0.38), 0 0 0 3px rgba(255, 232, 145, 0.2);
      }

      .button-secondary:hover,
      .button-secondary:focus-visible {
        border-color: #ffe58a;
        background: linear-gradient(180deg, #1c4a35, #0e2a1e);
        box-shadow: 0 0 0 3px rgba(255, 232, 145, 0.16);
      }

      .button:active {
        transform: translateY(1px) scale(0.985);
      }

      .edition {
        margin-top: 18px;
        color: #9eb0a2;
        font-size: 0.63rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      @keyframes cover-drift {
        from { transform: scale(1.04) translate3d(-0.6%, -0.3%, 0); }
        to { transform: scale(1.1) translate3d(0.8%, 0.5%, 0); }
      }

      @keyframes spark-rise {
        0% { opacity: 0; transform: translate3d(0, 0, 0) scale(0.7); }
        12% { opacity: 0.88; }
        70% { opacity: 0.52; }
        100% { opacity: 0; transform: translate3d(22px, -116vh, 0) scale(1.35); }
      }

      @keyframes panel-glint {
        0%, 68% { transform: translateX(-110%); }
        84%, 100% { transform: translateX(110%); }
      }

      @media (max-width: 560px) {
        .opening {
          place-items: center;
          overflow-y: auto;
        }

        .frame {
          border-radius: 23px;
        }

        .panel {
          border-radius: 22px;
        }

        .actions {
          grid-template-columns: 1fr;
        }

        .button {
          min-height: 54px;
        }

        .features span:not(:last-child)::after {
          display: none;
        }
      }

      @media (max-height: 620px) and (orientation: landscape) {
        .opening {
          align-items: start;
          overflow-y: auto;
        }

        .frame {
          margin-block: 8px;
        }

        .panel {
          padding-block: 20px;
        }

        h1 {
          font-size: clamp(3rem, 13vh, 5.2rem);
        }

        .tagline {
          margin-top: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cover,
        .spark,
        .panel::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="opening">
      <div class="cover" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="spark-field" aria-hidden="true">
        <i class="spark" style="--left: 4%; --size: 3px; --delay: -2s; --duration: 7.5s"></i>
        <i class="spark" style="--left: 10%; --size: 5px; --delay: -6s; --duration: 10s"></i>
        <i class="spark" style="--left: 17%; --size: 2px; --delay: -4s; --duration: 8.5s"></i>
        <i class="spark" style="--left: 24%; --size: 4px; --delay: -8s; --duration: 11s"></i>
        <i class="spark" style="--left: 31%; --size: 3px; --delay: -1s; --duration: 9s"></i>
        <i class="spark" style="--left: 38%; --size: 5px; --delay: -7s; --duration: 12s"></i>
        <i class="spark" style="--left: 45%; --size: 2px; --delay: -5s; --duration: 8s"></i>
        <i class="spark" style="--left: 52%; --size: 4px; --delay: -3s; --duration: 10.5s"></i>
        <i class="spark" style="--left: 59%; --size: 3px; --delay: -9s; --duration: 12.5s"></i>
        <i class="spark" style="--left: 66%; --size: 5px; --delay: -2.5s; --duration: 9.5s"></i>
        <i class="spark" style="--left: 73%; --size: 2px; --delay: -6.5s; --duration: 8.5s"></i>
        <i class="spark" style="--left: 80%; --size: 4px; --delay: -4.5s; --duration: 11.5s"></i>
        <i class="spark" style="--left: 87%; --size: 3px; --delay: -7.5s; --duration: 9s"></i>
        <i class="spark" style="--left: 94%; --size: 5px; --delay: -1.5s; --duration: 12s"></i>
      </div>

      <div class="frame">
        <section class="panel" aria-labelledby="game-title">
          <p class="eyebrow">The browser board game</p>
          <h1 id="game-title"><span>Fortune</span><span>Avenue</span></h1>
          <p class="tagline">Roll In. Buy Big. Cause Chaos.</p>
          <p class="features"><span>2–6 players</span><span>Bot play</span><span>Private rooms</span></p>
          <nav class="actions" aria-label="Opening screen actions">
            <a class="button button-primary" href="/play">Enter the Avenue</a>
            <a class="button button-secondary" href="/play?rules=1">Read the rules</a>
          </nav>
          <span class="edition">Fortune Avenue • Web Edition</span>
        </section>
      </div>
    </main>
  </body>
</html>
